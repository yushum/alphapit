name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: alphapit_test
          POSTGRES_USER: alphapit_ci
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U alphapit_ci -d alphapit_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      SMOKE_CONTAINER: alphapit-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          version: '0.6.17'
          enable-cache: false
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy src tests
      - name: Unit tests
        run: uv run pytest -m 'not integration'
      - name: PostgreSQL integration tests (no skips)
        env:
          TEST_DATABASE_URL: postgresql://alphapit_ci:ci_only_password@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/alphapit_test
        run: |
          uv run pytest -m integration --junitxml="$RUNNER_TEMP/integration-results.xml"
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path(os.environ["RUNNER_TEMP"]) / "integration-results.xml"
          cases = ET.parse(report).findall(".//testcase")
          if not cases or any(case.find("skipped") is not None for case in cases):
              raise SystemExit("Integration tests must execute without skips")
          PY
      - name: Build wheel and source distribution
        run: uv run python -m build
      - name: Build Docker image
        run: docker build -t alphapit:ci .
      - name: Docker HTTP and JSON smoke
        timeout-minutes: 3
        env:
          DATABASE_URL: postgresql://alphapit_ci:ci_only_password@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/alphapit_test
        run: |
          docker run --detach --name "$SMOKE_CONTAINER" --network host \
            --env DATABASE_URL alphapit:ci
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          for endpoint, expected in (("live", "ok"), ("ready", "ready")):
              deadline = time.monotonic() + 60
              while time.monotonic() < deadline:
                  try:
                      with urllib.request.urlopen(
                          f"http://127.0.0.1:8000/health/{endpoint}", timeout=3
                      ) as response:
                          if response.status == 200 and json.load(response) == {
                              "status": expected
                          }:
                              break
                  except (urllib.error.URLError, TimeoutError, json.JSONDecodeError):
                      pass
                  time.sleep(1)
              else:
                  raise SystemExit(f"Health check failed: {endpoint}")
              print(f"/health/{endpoint}: HTTP 200 and expected JSON")
          PY
      - name: Clean up smoke container
        if: always()
        timeout-minutes: 1
        run: |
          container_id="$(docker container ls --all --quiet --filter "name=^/${SMOKE_CONTAINER}$")"
          if [ -n "$container_id" ]; then
            docker rm --force --volumes "$container_id"
          fi
